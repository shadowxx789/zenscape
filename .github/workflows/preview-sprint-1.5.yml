name: Preview sprint-1.5

on:
  workflow_dispatch:
  push:
    branches: [sprint-1.5-water]
    paths:
      - 'app/**'
      - '.github/workflows/preview-sprint-1.5.yml'

permissions:
  contents: write

concurrency:
  group: preview-sprint-1.5
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sprint-1.5-water
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build preview (subdir only, no live overwrite)
        working-directory: app
        run: npx vite build --base /zenscape/sprint-1.5/

      - name: Publish to gh-pages/sprint-1.5
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          destination_dir: sprint-1.5
          keep_files: true
          commit_message: 'preview: sprint-1.5 water first listen'
